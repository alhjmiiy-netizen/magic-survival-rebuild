<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.7" />

  <!-- Outer Arcane Circles & Celestial Runes -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />

  <!-- 8-Pointed Celestial Star Wings -->
  <g filter="url(#neonGlow)">
    <!-- Cardinal Wings -->
    <path d="M 256 56 L 272 230 L 456 256 L 272 282 L 256 456 L 240 282 L 56 256 L 240 230 Z" fill="url(#cyanGrad)" opacity="0.9" />
    <!-- Diagonal Spikes -->
    <path d="M 256 256 L 375 137 M 256 256 L 375 375 M 256 256 L 137 375 M 256 256 L 137 137" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Magic Circles & Interlocking Triangles -->
  <polygon points="256,120 373,324 139,324" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
  <polygon points="256,392 373,188 139,188" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8" />

  <!-- Core Radiant Crystal & Diamond -->
  <circle cx="256" cy="256" r="90" fill="url(#coreGlow)" />
  <polygon points="256,190 310,256 256,322 202,256" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
  <polygon points="256,215 285,256 256,297 227,256" fill="#ffffff" opacity="0.9" />
</svg>
